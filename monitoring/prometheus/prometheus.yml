global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      # Docker Desktop/WSL2 không cung cấp tên container cho cAdvisor (docker
      # factory không đăng ký được vì thiếu containerd socket), nên metrics chỉ
      # có nhãn `id`. Rút gọn id `/docker/<hex>` thành `container_id` ngắn gọn.
      - source_labels: [id]
        regex: '/docker/([0-9a-f]{12})[0-9a-f]*'
        target_label: container_id
        replacement: '$1'

  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:8080"]

  - job_name: nginx-exporter
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
