<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Đăng nhập{% endblock %} · Thư viện</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand auth-brand" href="{{ url_for('login') }}"><span class="brand-mark">TV</span><span>Thư viện<small>QUẢN LÝ NỘI BỘ</small></span></a>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
    <p class="auth-footnote">Hệ thống quản lý thư viện · Nội bộ</p>
  </main>
</body>
</html>
